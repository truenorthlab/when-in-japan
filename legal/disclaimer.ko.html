<h1>안내 문구</h1>
<p>이 앱은 일본의 매너와 규칙에 관한 일반적인 정보를 제공하고 공식 정보를 안내하는 것만을 목적으로 하며, 법률 상담이나 법적 조언이 아닙니다. 정식 내용은 각 항목에 링크한 국가·지자체 등의 공식 정보에 따르며, 앱의 내용과 다르면 공식 정보가 우선합니다. 게재된 정보는 확인일 기준이며 최신성·정확성을 보장하지 않습니다. 절차를 밟거나 중요한 판단을 하기 전에는 반드시 공식 정보를 확인하거나 전문가·공공 상담 창구에 문의해 주세요.</p>
